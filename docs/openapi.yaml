openapi: 3.0.3
info:
  title: SEN Support Platform API
  version: 0.1.0-draft
  description: >-
    Draft API contract derived from docs/srs.md, the access matrix, security/privacy
    requirements, data inventory, backend/internal/domain, and docs/diagrams/er.mmd.
    Bearer JWT is used for authenticated API requests. Authentication credentials
    and refresh secrets use HTTP Basic and an HttpOnly cookie so secrets are not
    represented as resource DTO fields. A child resource without an active
    relationship returns 404 (SEC-11); an existing relationship without the
    required permission returns 403. Invalid fields return 422. Parent diary
    writes are limited to shared; Parent reads and exports never include
    specialists_only. Admin responses never include diary content. Guest can
    only register and sign in.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder base URL; deployment host is not specified in source documents.
tags:
  - name: auth
  - name: child profile
  - name: guardian and specialist links
  - name: sessions
  - name: diary
  - name: audit
  - name: export
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a Parent or an approved Specialist
      description: |
        FR-01, SC-01; SEC-01, SEC-02, SEC-13, SEC-14. Guest may register only as
        Parent or an already approved Specialist; public registration cannot
        create Admin. The email and password are HTTP Basic credentials; the
        JSON body contains only User fields. Example request: Basic username
        `parent@example.test`, body `{"first_name":"Aida","last_name":"S." ,"role":"parent"}`.
        Example response (201): `{"id":"u-1","email":"parent@example.test","first_name":"Aida","last_name":"S.","role":"parent","status":"active","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              first_name: Aida
              last_name: S.
              role: parent
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /auth/token:
    post:
      tags: [auth]
      summary: Sign in
      description: |
        FR-01, SC-01; SEC-03, SEC-04, SEC-05, SEC-08, AUD-05. Basic username is
        email; password is not included in a DTO. Success returns a short-lived
        JWT in the Authorization response header and the refresh secret in an
        HttpOnly, Secure cookie. Failure uses a generic response for unknown
        email and wrong password; rate limiting may return 429. Example request:
        Basic username `parent@example.test`. Example response (200):
        `Authorization: Bearer eyJ...`; `Set-Cookie: refresh=...; HttpOnly; Secure`.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Signed in; raw credentials and token secrets are not JSON DTOs.
          headers:
            Authorization:
              description: Short-lived bearer JWT.
              schema: { type: string }
            Set-Cookie:
              description: Rotating refresh token cookie; server stores only its hash.
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
        '429':
          description: Login is temporarily rate limited or locked under SEC-03.
          content:
            text/plain:
              schema: { type: string }
              example: try again later

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: |
        FR-01, SC-01; SEC-05, SEC-06, AUD-05. Send the refresh cookie; the old
        token is rotated and cannot be reused. Example request:
        `Cookie: refresh=opaque-secret`. Example response (200):
        `Authorization: Bearer eyJ...`; replacement `Set-Cookie` header.
      security: []
      parameters:
        - name: Cookie
          in: header
          required: true
          schema: { type: string }
          example: refresh=opaque-secret
      responses:
        '200':
          description: Rotated; new access JWT and refresh cookie are returned in headers.
          headers:
            Authorization:
              description: Short-lived bearer JWT.
              schema: { type: string }
            Set-Cookie:
              description: Replacement refresh token cookie.
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      description: |
        FR-01, SC-01; SEC-06, AUD-05. Revokes the refresh token associated with
        the cookie. Example request: `Cookie: refresh=opaque-secret` with a
        bearer JWT. Example response (204): no body; refresh cookie is cleared.
      parameters:
        - name: Cookie
          in: header
          required: true
          schema: { type: string }
          example: refresh=opaque-secret
      responses:
        '204':
          description: Session ended; refresh cookie cleared.
          headers:
            Set-Cookie:
              description: Expired refresh cookie.
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [child profile]
      summary: Read child profile
      description: |
        FR-02, FR-15, SC-02; SEC-11. Parent and Specialist need an active
        relationship; Admin receives metadata only. No relationship, including
        an ended assignment, returns 404; insufficient rights on an existing
        relationship returns 403. Example request: `GET /children/c-1`.
        Example response (200): `{"id":"c-1","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.
      responses:
        '200':
          description: Child profile fields permitted for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
    patch:
      tags: [child profile]
      summary: Update child profile
      description: |
        FR-02, SC-02; SEC-11, SEC-20, AUD-01. Only a primary Parent with an
        active relationship may change the profile. No relationship returns
        404; a linked non-primary Parent, Specialist or Admin returns 403.
        Example request: `{"first_name":"Mira","birth_date":"2018-04-12"}`.
        Example response (200): `{"id":"c-1","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T11:00:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildProfileUpdate' }
            example: { first_name: Mira, birth_date: '2018-04-12' }
      responses:
        '200':
          description: Updated child profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Child' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/guardians:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    post:
      tags: [guardian and specialist links]
      summary: Link a guardian
      description: |
        FR-03, SC-07; SEC-11, SEC-13, AUD-01. Primary Parent for a related
        child or Admin may create the link. No Parent relationship returns 404;
        an existing relationship without primary rights returns 403. Example
        request: `{"guardian_id":"u-2","relationship":"guardian","is_primary":false}`.
        Example response (201): `{"child_id":"c-1","guardian_id":"u-2","relationship":"guardian","is_primary":false,"created_at":"2026-10-23T10:00:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardianLinkInput' }
            example: { guardian_id: u-2, relationship: guardian, is_primary: false }
      responses:
        '201':
          description: Guardian link created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildGuardian' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/specialist-assignments:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    post:
      tags: [guardian and specialist links]
      summary: Assign a specialist
      description: |
        FR-03, SC-07; SEC-11, SEC-14, AUD-01. Primary Parent for a related
        child or Admin may assign an approved Specialist. No Parent relationship
        returns 404; an existing relationship without primary rights returns
        403. The actor and assignment time are server-derived. Example request:
        `{"specialist_id":"u-3"}`. Example response (201):
        `{"child_id":"c-1","specialist_id":"u-3","assigned_by":"u-1","assigned_at":"2026-10-23T10:00:00Z","ended_at":null}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpecialistAssignmentInput' }
            example: { specialist_id: u-3 }
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildSpecialist' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/specialist-assignments/{specialistId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - name: specialistId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [guardian and specialist links]
      summary: End a specialist assignment
      description: |
        FR-03, SC-07; SEC-11, AUD-01. Primary Parent for a related child or
        Admin may set ended_at. Revocation is effective on the next request,
        including a request with an earlier JWT. No relationship returns 404;
        insufficient rights returns 403. Example request:
        `{"ended_at":"2026-10-23T11:00:00Z"}`. Example response (200):
        `{"child_id":"c-1","specialist_id":"u-3","assigned_by":"u-1","assigned_at":"2026-10-23T10:00:00Z","ended_at":"2026-10-23T11:00:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentEndInput' }
            example: { ended_at: '2026-10-23T11:00:00Z' }
      responses:
        '200':
          description: Ended assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildSpecialist' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/sessions:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [sessions]
      summary: List support sessions
      description: |
        FR-04, SC-03; SEC-11, AUD-01. Parent or Specialist with an active
        relationship may read permitted fields. Admin has no individual session
        access. No relationship returns 404; a linked role without permission
        returns 403. Example request: `GET /children/c-1/sessions`.
        Example response (200): `[{"id":"ss-1","child_id":"c-1","specialist_id":"u-3","created_by":"u-1","title":"Weekly support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}]`.
      responses:
        '200':
          description: Sessions permitted to the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [sessions]
      summary: Update or cancel a support session
      description: |
        FR-05, SC-03; SEC-11, SEC-20, AUD-01. Parent with an active relationship
        or the assigned Specialist may update permitted fields or set status to
        `cancelled`. Admin has no individual session access. No relationship
        returns 404; insufficient rights returns 403; invalid data returns 422.
        Example request: `{"status":"cancelled"}`. Example response (200):
        `{"id":"ss-1","child_id":"c-1","specialist_id":"u-3","created_by":"u-1","title":"Weekly support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"cancelled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T11:00:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportSessionUpdate' }
            example: { status: cancelled }
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
    post:
      tags: [sessions]
      summary: Create a support session
      description: |
        FR-05, SC-03; SEC-11, SEC-20, AUD-01. Parent or Specialist with an
        active relationship may create a session; actor and child context are
        server-derived. No relationship returns 404; forbidden role/action
        returns 403; invalid interval, mode or status returns 422. Example
        request: `{"specialist_id":"u-3","title":"Weekly support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled"}`.
        Example response (201): `{"id":"ss-1","child_id":"c-1","specialist_id":"u-3","created_by":"u-1","title":"Weekly support","starts_at":"2026-10-24T09:00:00Z","ends_at":"2026-10-24T10:00:00Z","mode":"online","status":"scheduled","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportSessionInput' }
            example:
              specialist_id: u-3
              title: Weekly support
              starts_at: '2026-10-24T09:00:00Z'
              ends_at: '2026-10-24T10:00:00Z'
              mode: online
              status: scheduled
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/diary-entries:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [diary]
      summary: List diary entries
      description: |
        FR-07, SC-04; SEC-11, SEC-12, SEC-15, AUD-01. Parent receives shared
        entries only; Specialist with an active relationship may receive both
        visibility values; Admin never receives content. No relationship
        returns 404; a related actor lacking permission returns 403. Example
        request: `GET /children/c-1/diary-entries`. Example response (200):
        `[{"id":"d-1","child_id":"c-1","author_id":"u-1","type":"observation","visibility":"shared","content":"Joined the activity.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T09:01:00Z"}]`.
      responses:
        '200':
          description: Visibility-filtered entries; never includes Admin diary content.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiaryEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'
    post:
      tags: [diary]
      summary: Create a diary entry
      description: |
        FR-06, SC-04; SEC-11, SEC-12, SEC-13, SEC-20, AUD-01. Parent may write
        only `shared`; Specialist with an active relationship may choose either
        visibility. A Parent asking for `specialists_only` is forbidden (403);
        an unknown visibility/type or missing required value is invalid (422).
        No relationship returns 404. Author and child are server-derived.
        Example request: `{"type":"observation","visibility":"shared","content":"Joined the activity.","observed_at":"2026-10-23T09:00:00Z"}`.
        Example response (201): `{"id":"d-1","child_id":"c-1","author_id":"u-1","type":"observation","visibility":"shared","content":"Joined the activity.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T09:01:00Z"}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryInput' }
            example:
              type: observation
              visibility: shared
              content: Joined the activity.
              observed_at: '2026-10-23T09:00:00Z'
      responses:
        '201':
          description: Diary entry created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/diary-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [diary]
      summary: Update an authored diary entry
      description: |
        FR-08, SC-04, SC-05; SEC-11, SEC-12, SEC-20, AUD-01, AUD-03. Parent or
        Specialist may edit only their own entry, subject to visibility; each
        edit preserves the prior version. Parent writes remain `shared` only.
        No relationship returns 404; a linked actor without edit rights returns
        403. Invalid data returns 422. Example request:
        `{"type":"progress","visibility":"shared","content":"Completed the task.","observed_at":"2026-10-23T09:00:00Z"}`.
        Example response (200): `{"id":"d-1","child_id":"c-1","author_id":"u-1","type":"progress","visibility":"shared","content":"Completed the task.","observed_at":"2026-10-23T09:00:00Z","created_at":"2026-10-23T09:01:00Z","updated_at":"2026-10-23T10:00:00Z"}`; prior state appears in history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryEntryInput' }
            example:
              type: progress
              visibility: shared
              content: Completed the task.
              observed_at: '2026-10-23T09:00:00Z'
      responses:
        '200':
          description: Updated current entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiaryEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/diary-entries/{entryId}/versions:
    parameters:
      - $ref: '#/components/parameters/ChildId'
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [diary]
      summary: Read diary entry history
      description: |
        FR-08, SC-05; SEC-11, SEC-12, SEC-15, AUD-01, AUD-03. History uses the
        same relationship, ownership and visibility rules as the current entry.
        Parent sees shared history only; Admin never sees diary content. No
        relationship returns 404; insufficient rights returns 403. Example
        request: `GET /children/c-1/diary-entries/d-1/versions`. Example response
        (200): `[{"id":"dv-1","entry_id":"d-1","version_number":1,"changed_by":"u-1","type":"observation","visibility":"shared","content":"Joined the activity.","observed_at":"2026-10-23T09:00:00Z","changed_at":"2026-10-23T09:01:00Z"}]`.
      responses:
        '200':
          description: Authorized immutable diary snapshots.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiaryEntryVersion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [audit]
      summary: Read permitted audit events for a child
      description: |
        FR-09, FR-14, SC-06, SC-07; SEC-11, SEC-15, AUD-01, AUD-04. A related
        Parent may see access events for that child; Admin may see permitted
        audit metadata. No Parent relationship returns 404; other insufficient
        rights return 403. Response excludes source_ip and attempted identifier
        keys. Example request: `GET /children/c-1/audit-events`. Example response
        (200): `[{"id":"a-1","actor_id":"u-3","child_id":"c-1","action":"read","resource":"diary_entry","resource_id":"d-1","outcome":"success","request_id":"r-1","occurred_at":"2026-10-23T10:00:00Z"}]`.
      responses:
        '200':
          description: Permitted audit fields only; no diary content or credential data.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEventView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

  /children/{childId}/exports:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    post:
      tags: [export]
      summary: Export permitted child records
      description: |
        FR-12, SC-08; SEC-11, SEC-12, SEC-15, PRV-05, AUD-01. Primary Parent
        with an active relationship may export profile, sessions and `shared`
        diary entries. `specialists_only` content is excluded. Admin may not
        request this guardian export; Admin exports are metadata-only and are
        outside this operation. No relationship returns 404; linked non-primary
        Parent returns 403. Example request: `POST /children/c-1/exports` with
        empty body. Example response (200): `[{"id":"c-1","first_name":"Mira","last_name":"S.","birth_date":"2018-04-12","created_at":"2026-10-23T10:00:00Z","updated_at":"2026-10-23T10:00:00Z"}]`; additional array items are permitted sessions and shared diary entries.
      responses:
        '200':
          description: Exported permitted records; contains no non-ER fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Child'
                    - $ref: '#/components/schemas/SupportSession'
                    - $ref: '#/components/schemas/DiaryEntry'
              example:
                - id: c-1
                  first_name: Mira
                  last_name: S.
                  birth_date: '2018-04-12'
                  created_at: '2026-10-23T10:00:00Z'
                  updated_at: '2026-10-23T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidData'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing/invalid bearer JWT or invalid credentials; generic auth failure.
      content:
        text/plain:
          schema: { type: string }
          example: unauthorized
    Forbidden:
      description: Relationship exists but role or right is insufficient.
      content:
        text/plain:
          schema: { type: string }
          example: forbidden
    NotFound:
      description: Resource not found or no active relationship; existence is not confirmed.
      content:
        text/plain:
          schema: { type: string }
          example: not found
    InvalidData:
      description: Request fields are missing, malformed, or outside the allowed domain values.
      content:
        text/plain:
          schema: { type: string }
          example: invalid data
  schemas:
    Registration:
      type: object
      additionalProperties: false
      required: [first_name, last_name, role]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        role:
          type: string
          enum: [parent, specialist]
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, enum: [parent, specialist, admin] }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Child:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChildProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date }
    GuardianLinkInput:
      type: object
      additionalProperties: false
      required: [guardian_id, relationship, is_primary]
      properties:
        guardian_id: { type: string }
        relationship: { type: string, enum: [parent, guardian] }
        is_primary: { type: boolean }
    ChildGuardian:
      type: object
      properties:
        child_id: { type: string }
        guardian_id: { type: string }
        relationship: { type: string, enum: [parent, guardian] }
        is_primary: { type: boolean }
        created_at: { type: string, format: date-time }
    SpecialistAssignmentInput:
      type: object
      additionalProperties: false
      required: [specialist_id]
      properties:
        specialist_id: { type: string }
    ChildSpecialist:
      type: object
      properties:
        child_id: { type: string }
        specialist_id: { type: string }
        assigned_by: { type: string }
        assigned_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
    AssignmentEndInput:
      type: object
      additionalProperties: false
      required: [ended_at]
      properties:
        ended_at: { type: string, format: date-time }
    SupportSessionInput:
      type: object
      additionalProperties: false
      required: [specialist_id, title, starts_at, ends_at, mode, status]
      properties:
        specialist_id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { type: string, enum: [online, in_person] }
        status: { type: string, enum: [scheduled, completed, cancelled] }
    SupportSession:
      type: object
      properties:
        id: { type: string }
        child_id: { type: string }
        specialist_id: { type: string }
        created_by: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { type: string, enum: [online, in_person] }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SupportSessionUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        mode: { type: string, enum: [online, in_person] }
        status: { type: string, enum: [scheduled, completed, cancelled] }
    DiaryEntryInput:
      type: object
      additionalProperties: false
      required: [type, visibility, content, observed_at]
      properties:
        type: { type: string, enum: [observation, progress, recommendation] }
        visibility: { type: string, enum: [shared, specialists_only] }
        content: { type: string }
        observed_at: { type: string, format: date-time }
    DiaryEntry:
      type: object
      properties:
        id: { type: string }
        child_id: { type: string }
        author_id: { type: string }
        type: { type: string, enum: [observation, progress, recommendation] }
        visibility: { type: string, enum: [shared, specialists_only] }
        content: { type: string }
        observed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DiaryEntryVersion:
      type: object
      properties:
        id: { type: string }
        entry_id: { type: string }
        version_number: { type: integer }
        changed_by: { type: string }
        type: { type: string, enum: [observation, progress, recommendation] }
        visibility: { type: string, enum: [shared, specialists_only] }
        content: { type: string }
        observed_at: { type: string, format: date-time }
        changed_at: { type: string, format: date-time }
    AuditEventView:
      type: object
      properties:
        id: { type: string }
        actor_id: { type: string, nullable: true }
        child_id: { type: string, nullable: true }
        action: { type: string }
        resource: { type: string }
        resource_id: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }
